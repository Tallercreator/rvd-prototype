<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>РВД · прототип</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* ---- Сайдбар и шапка как в макетах ---- */
  .nav{gap:0;overflow:auto}
  .nav button,.bottom button{font-size:17px}
  .nav .badge{margin-left:auto;min-width:20px;line-height:20px}
  .nav .chev{margin-left:auto;opacity:.7}
  .bottom{padding-top:0}
  .bottom .help .mascot-dot{position:absolute;right:8px;bottom:6px;width:30px;height:30px;border-radius:50%;background:var(--lime);border:2px solid #222}
  .header-tools{gap:32px}
  .avatar{display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#53565d}
  .ico{width:24px;height:24px;flex-shrink:0}
  /* ---- Тулбар ---- */
  .tabs button{display:inline-flex;align-items:center;gap:6px}
  .tabs .badge{line-height:18px}
  .create-menu{width:420px}
  .create-menu .grp{padding:8px 16px 4px;font-size:14px;color:#8a8f99;font-weight:600}
  /* ---- Список ---- */
  .status-bubble{position:relative}
  .status-bubble .dot{position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 2px #fff}
  .status-bubble.done{background:#e4ffab}
  .status-bubble.partial{background:#fff2d6}
  .status-bubble svg{width:26px;height:26px}
  .empty-list{padding:32px 8px;color:var(--muted);text-align:center;font-size:16px}
  .workspace{min-height:calc(100vh - 230px)}
  .request-list{min-height:calc(100vh - 230px)}
  .empty-detail{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:320px;color:var(--muted);gap:12px}
  /* ---- Карточка заявки ---- */
  .panel{position:relative}
  .panel-head{margin-bottom:32px}
  .panel-head h1{margin-top:4px}
  .panel-head .meta{margin-top:8px;font-size:16px;color:#222}
  .expand{font-size:16px}
  .deadline{font-size:14px;line-height:22px;color:#53565d}
  .status-message p{margin-top:4px;font-size:16px;line-height:20px;color:#222}
  .status-message b{font-size:16px}
  .status-icon svg{width:22px;height:22px}
  .status-icon.cancel{background:#fde3dc}
  .status-icon.return{background:#efe2fa}
  .status-icon.partial{background:#fff2d6}
  .status-icon.paper{background:#ffe9d6}
  .status-icon.idea{background:#e3edfc;width:32px;height:32px;border-radius:10px}
  /* «Оцени заявку» висит над карточкой, как в макете */
  @media(min-width:801px){.panel .rate-box{top:-55px;right:-1px;width:176px;height:90px;border-radius:8px;padding:14px 0 0;font-size:15px;line-height:20px;z-index:5}.panel .rate-box .faces{gap:8px;margin-bottom:8px}.panel .rate-box svg{width:32px;height:32px}}
  .ready{display:flex;gap:24px;align-items:center}
  .ready img{width:112px;height:112px;flex-shrink:0}
  .ready b{display:block;font-size:16px}
  .ready p{font-size:16px;line-height:20px;margin-top:4px}
  .pdf-row{width:100%;display:flex;gap:12px;align-items:center;background:var(--selected);border-radius:12px;padding:14px 16px;text-align:left;margin-top:24px}
  .pdf-row+.pdf-row{margin-top:8px}
  .pdf-row b{display:block;font-weight:400;font-size:16px;line-height:20px}
  .pdf-row small{display:block;font-size:13px;color:#53565d}
  .pdf-row>span:nth-child(2){flex:1;min-width:0}
  .pdf-ico{width:26px;height:30px;border:1.5px solid #8a8f99;border-radius:3px;font-size:8px;font-weight:700;color:#53565d;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;flex-shrink:0}
  .rate-box{position:absolute;top:-1px;right:-1px;background:var(--lime);border-radius:0 24px 0 16px;padding:10px 18px 8px;text-align:center;font-size:13px;font-weight:600;line-height:16px;box-shadow:0 6px 16px #263b6420}
  .rate-box .faces{display:flex;gap:6px;justify-content:center;margin-bottom:4px}
  .rate-box button{padding:0;border-radius:50%}
  .rate-box button.on{background:#fff}
  .rate-box svg{width:26px;height:26px;display:block}
  .bubble-label{font-weight:600;font-size:16px;margin:24px 0 8px}
  .bubble-wrap{display:flex;gap:10px;align-items:flex-end}
  .bub-ava{width:28px;height:28px;border-radius:50%;background:#1f7a2e;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--lime);font-size:13px;font-weight:700}
  .bubble{background:#e8edf9;border-radius:12px 12px 12px 4px;padding:8px 14px;font-size:15px;line-height:20px;max-width:520px}
  .bubble b{display:block;font-size:13px;line-height:18px}
  .pairs-read{display:grid;gap:16px;margin-bottom:8px}
  .pairs-read dt{font-weight:700;font-size:16px}
  .pairs-read dd{margin:6px 0 0;font-size:16px}
  .details summary h2{font-size:22px;line-height:28px}
  .details[open] summary img{transform:rotate(180deg)}
  .details .general-fields{gap:20px;font-size:16px}
  .details .pair dt{font-size:16px}
  .history{list-style:none;padding:0;margin:0;font-size:15px;line-height:20px}
  .history li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--soft)}
  .history time{color:var(--muted);font-size:14px}
  .comp-table{width:100%;border-collapse:collapse;font-size:16px}
  .comp-table td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
  .comp-table td:first-child{width:40%;padding-right:12px}
  /* ---- Шаги ---- */
  .steps{padding:28px 8px 32px}
  .step b{display:block;font-size:14px;line-height:18px;font-weight:600;padding:0 4px}
  .step.future b{font-weight:400;color:#53565d}
  .step small{display:block;font-size:13px;line-height:18px;color:#53565d;margin-top:2px}
  .step-circle{font-size:18px}
  .step-circle.ok{color:var(--purple)}
  .step-circle.stop{color:#222;font-size:18px}
  /* ---- Подпись документа ---- */
  .sign-layout{grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
  .thumb-image{height:170px;background:#fff;padding:56px 26px 0}
  .thumb-image i{display:block;height:5px;border-radius:3px;background:#dfe3ea;margin:0 0 9px;filter:blur(.6px)}
  .viewed-tag{top:14px;right:12px;font-size:14px;line-height:20px;padding:2px 10px}
  .viewed-tag.unread{background:#fde3dc;border-color:#f6b8a8;color:#a2331d}
  .zoom{top:12px;left:12px;width:36px;height:36px}
  .thumb-caption{font-size:14px;line-height:18px;padding:12px}
  .thumb-caption span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sign-info{justify-content:flex-start;gap:12px}
  .sign-info .ttl{display:flex;gap:10px;align-items:center;font-weight:600;font-size:16px}
  .sign-info b{font-size:16px;line-height:20px;margin-top:16px}
  .sign-info .instruction{margin-top:4px;font-size:14px;color:#53565d}
  .btn.outline-dark{background:#fff;border:1px solid #222;color:#222}
  .btn.grey:disabled{background:#e6e8ec;color:#8a8f99;opacity:1}
  .form-actions{margin-top:32px}
  /* ---- Формы ---- */
  .field{max-width:600px}
  .field label.label,.field legend,.field .label{font-size:16px;display:flex;gap:4px;align-items:center;font-weight:700;margin-bottom:8px}
  .field textarea{font-size:16px}
  .under{display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:18px;margin-top:4px;color:#8a8f99}
  .under .ok{color:#6cb300}
  .under .bad{color:#ec6a2c}
  .err{color:#ec6a2c;font-size:13px;line-height:18px;margin-top:4px}
  .search-input{position:relative}
  .search-input input{width:100%;height:46px;border:1px solid #a6adba;border-radius:12px;padding:8px 44px 8px 16px;background:#fff;font-size:16px}
  .search-input input[readonly]{cursor:default}
  .search-input .asset{position:absolute;right:14px;top:11px;pointer-events:none}
  .emp-line{display:flex;gap:12px;align-items:center}
  .emp-line .picker{flex:1;max-width:none}
  .x-btn{width:28px;height:28px;font-size:22px;line-height:22px;color:#222;border-radius:8px;flex-shrink:0}
  .x-btn:hover{background:var(--soft)}
  /* Карточки сотрудников — по макету «РВД / руководитель» */
  .emp-card{background:#f4f6fa;border-radius:12px;margin-bottom:8px}
  .emp-head{display:flex;align-items:center}
  .emp-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 16px;border-radius:12px}
  .emp-toggle:hover{background:#00000005}
  .emp-title{flex:1;min-width:0}
  .emp-title b{display:block;font-size:16px;line-height:20px;font-weight:400;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .emp-title small{display:block;font-size:13px;line-height:18px;color:#8a8f99;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .emp-title small.bad{color:#ec6a2c}
  .emp-chev{transition:transform .15s;flex-shrink:0;opacity:.8}
  .emp-card:not(.col) .emp-chev{transform:rotate(180deg)}
  .emp-body{padding:4px 16px 16px}
  .emp-head.open{padding:16px 0 4px 16px}
  .emp-open-lbl{flex:1;margin:0!important;font-size:16px;font-weight:700;display:flex;gap:4px;align-items:center}
  .emp-body .field{margin-bottom:20px}
  .emp-body .field:last-child{margin-bottom:0}
  .emp-bar{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:16px}
  .emp-bar b{font-weight:700}
  .emp-bar .cnt{color:#222}
  .tog-all{margin-left:auto;font-size:15px;color:#222;padding:2px 0}
  .tog-all:hover{color:var(--purple)}
  .emp-note{font-size:14px;color:#53565d;margin-top:6px}
  .date-line{display:flex;gap:12px;align-items:center;margin-bottom:8px}
  .date-line input{height:46px;border:1px solid #a6adba;border-radius:12px;padding:8px 14px;background:#fff;width:240px;max-width:100%;font-size:16px}
  .add-link{display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:600;padding:4px 0;color:#222}
  .add-link:disabled{opacity:.4}
  .fill-hintX{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid #e3d3f2;border-radius:10px;padding:8px 8px 8px 12px;margin:0 0 18px;font-size:14px;line-height:18px;color:#53565d}
  .fill-hint select{height:30px;border:1px solid var(--line);border-radius:8px;padding:0 6px;font-size:14px;font-weight:600;color:#222;background:#fff;max-width:200px}
  .fill-hint .chip-btn{padding:5px 10px;font-size:13px}
  .fill-hint .chip-btn:disabled{opacity:.4}
  .fill-hint{position:relative;padding-right:40px}
  .fill-hint .x-btn{position:absolute;right:6px;top:6px;font-size:18px}
  .emp-acts{display:flex;align-items:center;gap:4px;padding-right:8px;flex-shrink:0}
  .emp-acts .ic{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px}
  .emp-acts .ic:hover{background:#00000008}
  .emp-acts .ic.del:hover svg{stroke:#cb374c}
  .copy-all{display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:18px;font-weight:600;color:#33363c;background:#e3e8f0;border-radius:8px;padding:6px 10px;margin-right:4px;white-space:nowrap}
  .copy-all:hover{background:#d6dde8}
  .like-wrap{position:relative;display:inline-block}
  .like-btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:18px;color:#33363c;background:#e3e8f0;border-radius:8px;padding:5px 10px}
  .like-btn:hover,.like-btn[aria-expanded=true]{background:#d6dde8}
  .like-btn .chev{width:12px;height:12px;transition:transform .15s}
  .like-btn[aria-expanded=true] .chev{transform:rotate(180deg)}
  .like-menu{position:absolute;left:0;top:calc(100% + 6px);z-index:30;background:#fff;border-radius:12px;box-shadow:0 16px 36px #263b6426;padding:6px;width:min(420px,80vw);max-height:300px;overflow:auto}
  .like-menu .cap{font-size:12px;line-height:16px;color:#8a8f99;padding:6px 10px 4px}
  .like-menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px;line-height:18px;color:#222}
  .like-menu button:hover{background:var(--soft)}
  .like-menu button small{display:block;color:#6b717c;font-size:13px;line-height:17px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .under-l{display:flex;align-items:center;gap:12px;min-width:0}
  .dates-like{margin:-2px 0 10px}
  @media(max-width:800px){.copy-all span{display:none}.copy-all{padding:6px 8px}}
  .add-emp-btn{display:inline-flex;align-items:center;gap:6px;background:#eef1f6;border-radius:8px;padding:6px 10px;font-size:13px;line-height:18px;color:#53565d;margin-top:8px}
  .add-emp-btn:hover{background:#e3e8f0}
  .add-emp-btn svg{width:14px;height:14px}
  .add-emp-btn small{color:#8a8f99;font-size:12px}
  .apply-all{display:inline-flex;align-items:center;gap:5px;font-size:13px;line-height:18px;font-weight:600;color:var(--purple);padding:2px 6px;margin:-2px -6px;border-radius:8px}
  .apply-all:hover{background:#f3e9fa}
  .apply-all img{filter:invert(52%) sepia(25%) saturate(900%) hue-rotate(235deg)}
  .under-r{display:flex;gap:14px;align-items:center;margin-left:auto}
  .dates-act{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  dialog.small.choice{width:520px}
  dialog.small .acts.col3{flex-wrap:wrap}
  dialog.small.choice .btn{padding:10px 16px}
  .chip-btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#5a2f7a;background:#f3e9fa;border-radius:10px;padding:6px 12px}
  .chip-btn:hover{background:#ead9f7}
  .chip-btn img{filter:invert(27%) sepia(28%) saturate(1300%) hue-rotate(240deg)}
  .limit{color:#ec6a2c;font-size:13px;line-height:18px}
  .checkline{font-weight:400;font-size:16px;align-items:flex-start;line-height:22px}
  .checkline input{margin-top:0}
  .tag{display:inline-block;font-size:12px;line-height:18px;border-radius:16px;padding:0 8px;margin-left:6px;vertical-align:1px;font-weight:600}
  .tag.refuse{background:#fff2d6;color:#7a5200}
  .tag.ban{background:#fbe5dd;color:#8c2a1c}
  .tag.has{background:var(--selected);color:#53565d}
  .picker-option[aria-disabled=true]{opacity:.55;cursor:not-allowed}
  .picker-dropdown{top:50px}
  .choices{gap:10px;font-size:16px}
  .comp-block{margin:0 0 24px}
  .comp-block h3{font-size:16px;margin-bottom:10px}
  .rest-field{margin:14px 0 0}
  .rest-field .label{font-weight:400!important}
  .consent{font-size:16px;line-height:22px;margin:8px 0 0;max-width:600px}
  .bank-check{margin-bottom:14px}
  .bank-check .checkline small{display:block;color:#8a8f99;font-size:13px;line-height:18px}
  .bank-check .field{margin:10px 0 0}
  .notice{font-size:15px;line-height:20px}
  .form-error{color:#ec6a2c;font-size:14px;margin-top:16px}
  /* ---- Подсказки ---- */
  .tipwrap{position:relative;display:inline-flex}
  .tip-btn{width:18px;height:18px;border:1.4px solid #53565d;border-radius:50%;font-size:11px;line-height:15px;font-weight:700;color:#53565d;padding:0;text-align:center}
  .tip-link{color:var(--purple);padding:0;text-align:left;font-size:inherit;line-height:inherit;display:inline}
  .tip-pop{display:none;position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);width:300px;background:#fff;border-radius:12px;box-shadow:0 10px 30px #263b6430;padding:10px 14px;font-size:13px;line-height:17px;font-weight:400;color:#222;z-index:40;text-align:left}
  .tip-pop.wide{width:460px}
  .tip-pop ol{margin:0;padding-left:18px}
  .tip-pop:after{content:'';position:absolute;top:100%;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#fff}
  .tipwrap:hover .tip-pop,.tipwrap:focus-within .tip-pop{display:block}
  /* ---- Заявка на нескольких ---- */
  .progress{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 0}
  .progress span{background:var(--soft);border-radius:10px;padding:4px 12px;font-size:14px}
  .progress b{margin-right:4px}
  .emp-th,.emp-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.9fr) minmax(0,1fr) 92px;gap:12px;align-items:center;text-align:left}
  .emp-th{padding:24px 14px 6px;color:#8a8f99;font-size:14px}
  .emp-row{width:100%;padding:10px 14px;border-radius:12px;background:var(--soft);margin-bottom:6px;font-size:15px;line-height:20px}
  .emp-row:hover{box-shadow:inset 0 0 0 1px var(--line)}
  .emp-row small{display:block;color:#8a8f99;font-size:13px;line-height:17px}
  .emp-row .st{display:flex;gap:8px;align-items:center}
  .emp-goal{grid-column:1/-1;font-size:14px;color:#53565d;border-top:1px solid var(--line);padding-top:6px}
  .sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#c9ced6}
  .sdot.wait{background:var(--purple)}.sdot.hr{background:#f0b429}.sdot.ok{background:#7cc417}.sdot.no{background:#cb374c}
  .back-link{display:inline-flex;gap:6px;align-items:center;color:#53565d;font-size:15px;padding:0;margin:0 0 12px}
  .by{font-size:14px;color:#5a2f7a;background:#f3e9fa;border-radius:8px;padding:1px 8px}
  /* ---- Отпуск ---- */
  .vac{padding:0 48px 32px 16px;max-width:1100px}
  .vac-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .vac-card{border:1px solid var(--line);border-radius:24px;padding:28px 32px;background:#fff}
  .vac-card.mutedcard{background:var(--soft);border-color:transparent}
  .vac-card .big{font-size:44px;line-height:52px;font-weight:600;margin:8px 0 4px}
  .bank-list{display:grid;gap:8px;margin-top:8px}
  .bank-item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 18px;border-radius:12px;background:var(--soft);font-size:16px}
  .bank-item small{display:block;color:#53565d;font-size:14px}
  .btag{font-size:13px;font-weight:600;border-radius:12px;padding:2px 10px;white-space:nowrap}
  .btag.av{background:#f2ffe3;color:#375d0f}.btag.res{background:#f3e9fa;color:#5a2f7a}.btag.used{background:#eceef2;color:#53565d}.btag.exp{background:#fbe5dd;color:#8c2a1c}.btag.soon{background:#fff2d6;color:#7a5200}
  .bank-chip{font-size:15px;color:#53565d;white-space:nowrap}
  .bank-chip button{color:var(--purple);font-weight:600;font-size:15px}
  /* ---- Прототип: служебная панель ---- */
  .proto{position:fixed;right:16px;bottom:16px;z-index:45;display:flex;gap:8px;align-items:center;background:#fff;border:2px dashed var(--purple);border-radius:14px;padding:6px 8px 6px 12px;box-shadow:0 8px 24px #263b6420;font-size:14px}
  .proto .ptag{color:#5a2f7a;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .proto select{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:14px;max-width:260px;background:#fff}
  .proto button{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff;white-space:nowrap}
  .proto button[aria-pressed=true]{background:#f3e9fa;border-color:var(--purple);color:#5a2f7a}
  .qpin{display:none;font-size:11px;line-height:16px;font-weight:700;color:#fff;background:var(--purple);border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:2px}
  body.show-q .qpin{display:inline-block}
  .qnote{display:none;border-left:3px solid var(--purple);background:#f7f0fc;border-radius:0 10px 10px 0;padding:10px 14px;font-size:14px;line-height:19px;margin:16px 0 0;color:#3e2752}
  body.show-q .qnote{display:block}
  .app-main{padding-bottom:64px}
  .toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#222;color:#fff;border-radius:12px;padding:12px 20px;font-size:16px;z-index:60;max-width:calc(100vw - 32px)}
  /* ---- Модалки ---- */
  dialog.small{width:440px}
  dialog.small .modal-head{border:0;padding:20px 20px 4px}
  dialog.small .modal-head h2{font-size:22px;line-height:28px}
  dialog.small .modal-body{padding:4px 20px 20px;font-size:15px;line-height:20px}

<script>
'use strict';
/* ================= Справочники ================= */
const MANAGER = {id:'m1', name:'Елена Когут', full:'Когут Елена Викторовна', short:'Когут Е. В.', acc:'Елену Когут', pos:'Начальник отдела отчётности'};
const DELEGATE = {id:'d1', name:'Марина Белова', full:'Белова Марина Андреевна', short:'Белова М. А.', role:'ИО руководителя'};
const HR = 'Отдел кадров', HR_MAIL = 'HRadmin@otpbank.ru', HR_PERSON = 'Ольга Смирнова';
const DEPT = 'Дирекция управления персоналом';
const mk = (id, full, job, state, extra) => { const [f, n, o] = full.split(' '); return {id, name: f + ' ' + n, first: n + ' ' + f, full, short: `${f} ${n[0]}. ${o[0]}.`, pos: job + ' · ' + DEPT, state, extra}; };
const PEOPLE = [
  mk('e1','Конченко Денис Анатольевич','Ведущий аналитик','ok'),
  mk('e2','Бруев Михаил Олегович','Специалист','refuse'),
  mk('e4','Афанасьева Дарья Антоновна','Продуктовый дизайнер','ok'),
  mk('e5','Месниченко Святослав Сергеевич','Экономист','ok'),
  mk('e9','Иванов Антон Петрович','Аналитик','ok', true),
  mk('e3','Новиков Артём Ильич','Стажёр, 17 лет','ban', true),
  ...['Абрамова Ольга Игоревна','Белов Артём Викторович','Васильева Марина Петровна','Гришин Илья Андреевич','Дорохова Анна Сергеевна','Ефимов Кирилл Романович','Жукова Татьяна Олеговна','Зайцев Никита Павлович','Ильина Вера Алексеевна','Ковалёв Роман Дмитриевич','Лаптева Ксения Юрьевна','Морозов Глеб Ильич','Никитина Алёна Викторовна','Орлов Павел Сергеевич','Панова Дарья Михайловна','Романов Егор Николаевич','Соколова Ирина Андреевна']
    .map((n, i) => mk('x' + i, n, ['Специалист','Аналитик','Экономист','Разработчик'][i % 4], i === 3 ? 'refuse' : 'ok', true)),
];
const person = id => PEOPLE.find(p => p.id === id);
const PERSONAS = [{id:'m1', role:'manager', label:'Руководитель · Елена Когут', ini:'ЕК'}, {id:'d1', role:'manager', label:'ИО руководителя · Марина Белова', ini:'МБ'}]
  .concat(PEOPLE.filter(p => p.state !== 'ban' && !p.extra).map(p => ({id:p.id, role:'employee', label:'Сотрудник · ' + p.name, ini:p.name.split(' ').map(x => x[0]).join('')})));
const MAX_EMPS = 20;
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c); };
const COMP = {double:'Оплата в двойном размере', rest:'Одинарная оплата с предоставлением дня отдыха'};
const TERMINAL = ['done','declined','expired','cancelled','paper'];
const TITLES = {rvd:'Работа в выходной день', otgul:'Отгул за работу в выходной день', order:'Приказ на отгул'};
/* Шаги: [этап, подпись пока идёт, подпись после выполнения] */
const STEPS = {
  rvd: [['created','Формирование заявки','Заявка сформирована'],['confirm','Формирование уведомления','Уведомление сформировано'],['sign','Подписание уведомления','Уведомление подписано'],['hr','Формирование приказа Отделом кадров','Приказ сформирован Отделом кадров'],['done','Завершение заявки','Заявка завершена']],
  otgul: [['draft','Формирование заявки','Заявка сформирована'],['sign','Подписание заявления','Заявление подписано'],['approve','Согласование руководителем','Согласовано руководителем'],['hr','Формирование приказа Отделом кадров','Приказ сформирован Отделом кадров'],['orderSign','Подписание приказа','Приказ подписан']],
  /* Заявка на нескольких, пока идёт: у каждого свой статус, поэтому общий шаг — «Заявка на исполнении» */
  rvdMulti: [['created','Формирование заявки','Заявка сформирована'],['confirm','Формирование уведомления','Формирование уведомления'],['exec','Заявка на исполнении','Заявка на исполнении'],['done','Завершение заявки','Заявка завершена']],
  order: [['hr','Формирование приказа Отделом кадров','Приказ сформирован Отделом кадров'],['orderSign','Подписание приказа','Приказ подписан']],
};
/* Как подписан остановленный шаг: отказ — «Отклонена сотрудником», отмена кадрами — «Заявка отменена», иначе — название шага */
const STOP_LABEL = {declined:'Отклонена сотрудником', cancelled:'Заявка отменена'};
const REFUSE_CATS = ['Женщины с детьми до 3 лет.','Работники с инвалидностью.','Работники, у которых есть дети с инвалидностью.','Работники, которые ухаживают за больными членами семьи по медицинскому заключению.','Матери и отцы, которые растят детей до 14 лет без супруга или супруги, и опекуны детей этого возраста.','Работники с ребёнком до 14 лет, если другой родитель работает вахтовым методом.','Работники с тремя и более детьми до 18 лет, пока младшему не исполнилось 14.','Работники с ребёнком до 14 лет, если другой родитель:<ul><li>призван по мобилизации;</li><li>или заключил контракт о военной службе;</li><li>или заключил контракт о добровольном содействии Вооружённым Силам либо Росгвардии.</li></ul>'];

/* ================= Даты и сроки ================= */
/* Часы прототипа: время идёт по сценарию (октябрь 2026, как в макетах), а не по реальному календарю */
const RealDate = Date;
let CLOCK = new RealDate(2026, 9, 23, 12, 0).getTime();
window.Date = class extends RealDate { constructor(...a){ if (a.length) super(...a); else super(CLOCK); } static now(){ return CLOCK; } };
const at = (y, m, d, h = 12, mi = 0) => new RealDate(y, m - 1, d, h, mi).getTime();
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const HOLI = ['01-01','01-02','01-03','01-04','01-05','01-06','01-07','01-08','02-23','03-08','05-01','05-09','06-12','11-04'];
const isHoliday = d => HOLI.includes(pad(d.getMonth()+1) + '-' + pad(d.getDate()));
const isOffDay = d => d.getDay() === 0 || d.getDay() === 6 || isHoliday(d);
const prevWorkday = d => { let x = addDays(d,-1); while (isOffDay(x)) x = addDays(x,-1); return x; };
const nPrevWork = (d,n) => { let x = d; for (let i = 0; i < n; i++) x = prevWorkday(x); return x; };
const addWorkdays = (d,n) => { let x = new Date(d), k = 0; while (k < n) { x = addDays(x,1); if (!isOffDay(x)) k++; } return x; };
const atTime = (d,h,m) => { const x = new Date(d); x.setHours(h,m,0,0); return x; };
const fmtD = d => pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear();
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const fmtWD = d => WD[d.getDay()] + ' ' + fmtD(d);
const fmtDayLong = d => fmtD(d) + ', ' + d.toLocaleDateString('ru-RU',{weekday:'long'});
const fmtDT = d => fmtD(d) + (d.getHours() === 23 && d.getMinutes() === 59 ? '' : ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes()));
const fmtDTfull = d => fmtD(d) + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
const fmtStamp = t => { const d = new Date(t); return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const numStr = x => { const d = new Date(x.created); return String(x.num).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + '/' + pad(d.getMonth()+1) + '-' + d.getFullYear(); };
function nextSaturday(minDays){ let d = addDays(new Date(), minDays); while (d.getDay() !== 6) d = addDays(d,1); return d; }
/* РВД — по примерам БТ (суббота → чт 13:00 / чт 23:59 / пт 23:59). Формула не утверждена — Q02. */
function deadlines(firstIso){ const D = prevWorkday(parse(firstIso)), C = prevWorkday(D); return {manager: atTime(C,13,0), employee: atTime(C,23,59), hr: atTime(D,23,59)}; }
/* Отгул — по примеру «отгул в пятницу»: заявление до пн, руководитель до ср, кадры до чт (Q03). */
function otgulDeadlines(firstOff){ const d = parse(firstOff); return {employee: atTime(nPrevWork(d,4),23,59), manager: atTime(nPrevWork(d,2),23,59), hr: atTime(nPrevWork(d,1),23,59)}; }
const orderDeadline = t => atTime(addWorkdays(new Date(t),3),23,59);
const expiresOf = rvd => rvd >= '2025-03-01' ? iso(addDays(parse(rvd), 364)) : null;
function bankDays(empId, exceptId){
  const own = S.requests.filter(r => r.type === 'rvd' && r.stage === 'done' && r.employeeId === empId).flatMap(r => r.dates.filter(s => r.comp[s] === 'rest' && !r.rest[s]));
  const legacy = (S.legacy || []).filter(l => l.employeeId === empId).map(l => l.rvd);
  const used = new Set(S.requests.filter(r => r.type !== 'rvd' && r.employeeId === empId && r.id !== exceptId && !['expired','cancelled'].includes(r.stage)).flatMap(r => r.pairs.map(p => p.rvd)));
  return [...new Set(legacy.concat(own))].filter(s => !used.has(s)).map(s => ({rvd:s, expires:expiresOf(s)})).sort((a,b) => a.rvd < b.rvd ? 1 : -1);
}
/* Можно взять отгулом / истёк год — день остаётся только для компенсации при увольнении */
const isLive = b => !b.expires || b.expires >= iso(new Date());
const bank = (empId, exceptId) => bankDays(empId, exceptId).filter(isLive);
const bankLost = (empId, exceptId) => bankDays(empId, exceptId).filter(b => !isLive(b));
const days = n => plural(n, 'день', 'дня', 'дней');
function bankSummary(empId, exceptId){
  const a = bank(empId, exceptId).length, l = bankLost(empId, exceptId).length;
  return `<div class="bank-sum"><b>${days(a + l)} в банке отгулов ${tip('Дни, заработанные за работу в выходной день')}${qpin('Q07','Когда день попадает в банк, резервируется и возвращается — не описано')}</b><p>Доступно для использования — ${days(a)}</p><p>Доступно для компенсации при увольнении — ${days(l)}</p></div>`;
}

/* ================= Состояние ================= */
/* Флоу для респондентов: ?flow=manager и ?flow=employee. Панель прототипа скрыта, за остальных участников отвечает автомат (см. «Флоу»).
   Переход по ссылке начинает флоу с нуля, обновление страницы — продолжает. */
const FLOW = ['manager','employee'].find(f => f === new URLSearchParams(location.search).get('flow')) || null;

  keys.slice(0, ci).forEach(x => r.at[x] = T[x]);

}

  });

  });

function demoEvent(ev){
  if (ev === 'day') { CLOCK += 864e5; $('#dlg').close(); toast('Сегодня в прототипе: ' + fmtD(new Date())); return; }
  if (ev === 'reset') { S = seed(); F = null; O = null; $('#dlg').close(); toast('Демо-данные сброшены'); return; }
  if (ev === 'sendOrder') {
    const emp = $('#ordEmp').value, b = bank(emp)[0];
    let off = addDays(new Date(), 7); while (isOffDay(off)) off = addDays(off,1);
    const x = {id:'r' + S.seq, num:String(S.seq++), type:'order', employeeId:emp, viewedOrder:false, pairs:[{rvd:b.rvd, off:iso(off)}], stage:'orderSign', orderAt:Date.now(), created:Date.now(), at:{hr:Date.now()}, history:[]};
    log(x, 'Отдел кадров сформировал приказ на отгул в 1С и подписал УКЭП'); S.requests.push(x);
    notify(emp, 'Подпиши приказ на отгул за работу в выходной день', 'Пожалуйста, подпиши приказ до ' + fmtDT(orderDeadline(x.orderAt)) + '.', x.id);
    $('#dlg').close(); toast('Приказ отправлен: ' + person(emp).name + '. Переключись на этого сотрудника'); return;
  }
  const g = S.selected && grp(S.selected);
  if (g && ev.startsWith('one:')) { const r = req($('#evEmp').value), e1 = ev.slice(4); if (e1 === 'hrDone' && r.stage !== 'hr') { toast('Сотрудник ещё не подписал уведомление'); return; } applyEv(r, e1); $('#dlg').close(); toast('Событие применено'); return; }
  if (g && branches(g).length === 1 && ['hrDone','expire','hrCancel'].includes(ev)) { applyEv(branches(g)[0], ev); $('#dlg').close(); toast('Событие применено'); return; }
  if (g) { branches(g).forEach(r => { if (ev === 'hrAll' && r.stage === 'hr') applyEv(r, 'hrDone'); if (ev === 'expireAll' && ['confirm','sign'].includes(r.stage)) applyEv(r, 'expire'); }); $('#dlg').close(); toast('Событие применено'); return; }
  const r = S.selected && req(S.selected); if (!r) return;
  applyEv(r, ev); $('#dlg').close(); toast('Событие применено');
}
function applyEv(r, ev){
  if (ev === 'hrDone') { go(r, 'done'); log(r, 'Отдел кадров сформировал приказ и подписал УКЭП'); notify(r.employeeId, 'Работа в выходной день оформлена', 'Приказ доступен для просмотра в заявке.', r.id); notify('m1', 'Работа в выходной день оформлена', person(r.employeeId).name + ': приказ подписан отделом кадров.', r.group); }
  if (ev === 'hrOrder') { go(r, 'orderSign'); r.orderAt = Date.now(); r.viewedOrder = false; log(r, 'Отдел кадров сформировал приказ на отгул и подписал УКЭП'); notify(r.employeeId, 'Подпиши приказ в заявке «Отгул за работу в выходной день»', 'Пожалуйста, подпиши приказ до ' + fmtDT(orderDeadline(r.orderAt)) + '.', r.id); }

  src.focus = () => tx.focus();
  if (src.labels) [...src.labels].forEach(l => l.addEventListener('click', e => { e.preventDefault(); tx.focus(); }));
  const commit = v => { if (v === src.value) { show(); return; } src.value = v; show(); src.dispatchEvent(new Event('change', {bubbles:true})); };
  let ym = null;
  const close = () => { pop.hidden = true; if (dtOpen === close) dtOpen = null; };
  /* Вид — как календарь в «Отпуске». Серые дни выбрать нельзя: для РВД это рабочие, для отгула — выходные и праздники */
  const forWork = src.dataset.k != null;
  const draw = () => {
    const [y, m] = ym, first = new Date(y, m, 1), shift = (first.getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate(), today = iso(new Date());
    const also = forWork && F && F.emps[+src.dataset.k] ? F.emps[+src.dataset.k].dates.filter(x => x && x !== src.value) : [];
    let cells = '<span></span>'.repeat(shift);
    for (let d = 1; d <= n; d++) { const dt = new Date(y, m, d), k = iso(dt), out = (src.min && k < src.min) || (src.max && k > src.max), rest = isOffDay(dt), off = out || (forWork ? !rest : rest) || (also[0] && also[0].slice(0,7) !== k.slice(0,7));
      cells += `<button type="button" data-dd="${k}" class="${isHoliday(dt) ? 'hol' : off ? 'no' : ''} ${out ? 'out' : ''} ${k === src.value ? 'on' : ''} ${also.includes(k) ? 'also' : ''} ${k === today ? 'now' : ''}" ${off ? 'disabled' : ''} aria-label="${fmtDayLong(dt)}" aria-pressed="${k === src.value}">${d}</button>`; }
    /* Если у сотрудника уже есть дата, другие месяцы закрыты */
    const prevOff = !!also[0] || (src.min && iso(new Date(y, m, 0)) < src.min), nextOff = !!also[0] || (src.max && iso(new Date(y, m + 1, 1)) > src.max);
    const ar = d => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
    pop.innerHTML = `<span class="dt-h"><button type="button" data-mv="-1" ${prevOff ? 'disabled' : ''} aria-label="Предыдущий месяц">${ar('m14.5 5.5-6.5 6.5 6.5 6.5')}</button><b>${MONTHS[m]} ${y}</b><button type="button" data-mv="1" ${nextOff ? 'disabled' : ''} aria-label="Следующий месяц">${ar('m9.5 5.5 6.5 6.5-6.5 6.5')}</button></span><span class="dt-g">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x => `<i>${x}</i>`).join('')}${cells}</span>`;
  };
  const open = () => {
    if (!pop.hidden) return;
    if (dtOpen) dtOpen();
    const sib = forWork && F && F.emps[+src.dataset.k] ? F.emps[+src.dataset.k].dates.find(x => x && x !== src.value) : '';
    const b = parse((sib && sib.slice(0,7) !== (src.value || '').slice(0,7) ? sib : src.value) || (src.min > iso(new Date()) ? src.min : iso(new Date()))); ym = [b.getFullYear(), b.getMonth()];
    draw(); pop.hidden = false; dtOpen = close;
    const r = pop.getBoundingClientRect(); if (r.bottom > innerHeight - 8 && tx.getBoundingClientRect().top > r.height + 16) pop.classList.add('up'); else pop.classList.remove('up');
  };
  tx.addEventListener('click', open);
  wrap.querySelector('.dt-btn').addEventListener('click', e => { e.preventDefault(); pop.hidden ? (open(), tx.focus()) : close(); });
  tx.addEventListener('input', e => {
    e.stopPropagation();
    const dg = tx.value.replace(/\D/g, '').slice(0, 8);
    tx.value = [dg.slice(0,2), dg.slice(2,4), dg.slice(4)].filter(Boolean).join('.');
    if (!dg) { if (src.value) commit(''); return; }
    const v = toIso(tx.value); if (v) { close(); commit(v); }
  });
  tx.addEventListener('change', e => e.stopPropagation());
  tx.addEventListener('blur', () => { if (tx.value && !toIso(tx.value)) show(); });
  tx.addEventListener('keydown', e => { if (e.key === 'Escape' && !pop.hidden) { e.stopPropagation(); close(); } if (e.key === 'ArrowDown') { e.preventDefault(); open(); pop.querySelector('.on:not(:disabled),.dt-g button:not(:disabled)')?.focus(); } if (e.key === 'Tab') close(); });
  pop.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); close(); tx.focus(); } });
  pop.addEventListener('mousedown', e => e.preventDefault());
  pop.addEventListener('click', e => {
    const mv = e.target.closest('[data-mv]'), dd = e.target.closest('[data-dd]');
    if (mv) { const d = new Date(ym[0], ym[1] + +mv.dataset.mv, 1); ym = [d.getFullYear(), d.getMonth()]; draw(); }
    if (dd && !dd.disabled) { close(); commit(dd.dataset.dd); }
  });
}
document.addEventListener('mousedown', e => { if (dtOpen && !e.target.closest('.dt')) dtOpen(); });
function upgradeDates(){ document.querySelectorAll('input[type=date]').forEach(dateField); }
new MutationObserver(upgradeDates).observe($('#detail'), {childList:true, subtree:true});
if (S.selected === 'new' || S.selected === 'newOtgul') S.selected = null;
if (FLOW) { document.body.classList.add('flow'); document.title = 'OTP Space'; S.auto = S.auto || {}; setInterval(flowTick, 500); }
render();
</script>
